<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="cyan-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="108" fill="url(#bg-grad)" />
  <g transform="translate(64, 64) scale(0.75)">
    <!-- Tower Crane / Skyscraper geometric motif -->
    <path d="M 120 400 L 120 120 L 160 120 L 160 400 Z" fill="#64748b" opacity="0.4" />
    <path d="M 160 400 L 160 80 L 260 80 L 260 400 Z" fill="url(#cyan-grad)" />
    <path d="M 260 400 L 260 160 L 360 160 L 360 400 Z" fill="url(#gold-grad)" />
    <!-- Grid lines / Architecture CAD motif -->
    <line x1="80" y1="400" x2="420" y2="400" stroke="#f8fafc" stroke-width="16" stroke-linecap="round" />
    <line x1="160" y1="140" x2="260" y2="140" stroke="#ffffff" stroke-width="4" stroke-opacity="0.6" />
    <line x1="160" y1="200" x2="260" y2="200" stroke="#ffffff" stroke-width="4" stroke-opacity="0.6" />
    <line x1="160" y1="260" x2="260" y2="260" stroke="#ffffff" stroke-width="4" stroke-opacity="0.6" />
    <line x1="160" y1="320" x2="260" y2="320" stroke="#ffffff" stroke-width="4" stroke-opacity="0.6" />
    <line x1="260" y1="220" x2="360" y2="220" stroke="#ffffff" stroke-width="4" stroke-opacity="0.6" />
    <line x1="260" y1="280" x2="360" y2="280" stroke="#ffffff" stroke-width="4" stroke-opacity="0.6" />
    <line x1="260" y1="340" x2="360" y2="340" stroke="#ffffff" stroke-width="4" stroke-opacity="0.6" />
    <!-- Precision Crosshair / Target -->
    <circle cx="260" cy="80" r="16" fill="#f59e0b" />
    <line x1="260" y1="40" x2="260" y2="120" stroke="#f59e0b" stroke-width="4" />
    <line x1="220" y1="80" x2="300" y2="80" stroke="#f59e0b" stroke-width="4" />
  </g>
</svg>
